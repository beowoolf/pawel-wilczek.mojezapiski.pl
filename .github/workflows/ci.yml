name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node env
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Run lintfix
        run: yarn lintfix

      - name: Run linter
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Build production
        run: yarn build
